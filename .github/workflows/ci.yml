name: Ryvix CI - Continuous Integration & Quality Gateway

on:
  push:
    branches: [ main, Testing_branch ]
  pull_request:
    branches: [ main, Testing_branch ]

jobs:
  lint-and-typecheck:
    name: Monorepo Typecheck & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Monorepo TypeScript Verification
        run: npm run typecheck

      - name: Check tracked files for credential regressions
        run: npm run security:secrets

      - name: Run lint
        run: npm run lint

  master-test-suite:
    name: Master Test Battery
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Execute Master Test Runner
        run: npm run test:offline

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Run provider-free browser fixtures
        run: npm run test:browser

  ai-neural-training-and-rag:
    name: Offline Synthetic AI Regression (Not Production Training)
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run isolated synthetic regression training
        run: npx tsx ai/scripts/train-local-model.ts

      - name: Verify offline regression artifacts (not promoted)
        run: |
          test -f ai/data/neural_weights.json || exit 1
          test -f ai/data/rag_vector_store.json || exit 1

  build-verification:
    name: Production Build & Container Hardening Scan
    needs: [master-test-suite, ai-neural-training-and-rag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Verify Package Compilation
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-project.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
        run: npm run --workspaces --if-present build
