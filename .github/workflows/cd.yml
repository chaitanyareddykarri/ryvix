name: Ryvix deployment

on:
  workflow_run:
    workflows: ["Ryvix CI - Continuous Integration & Quality Gateway"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ryvix-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && vars.RYVIX_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      revision: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Validate build settings
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo 'Set NEXT_PUBLIC_SUPABASE_URL'; exit 1; }
          test -n "$SUPABASE_KEY" || { echo 'Set NEXT_PUBLIC_SUPABASE_ANON_KEY'; exit 1; }
      - name: Select immutable image
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: echo "name=ghcr.io/${REPOSITORY,,}:$REVISION" >> "$GITHUB_OUTPUT"
      - name: Authenticate registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - name: Build and publish verified revision
        env:
          RYVIX_IMAGE: ${{ steps.image.outputs.name }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          docker build --platform linux/arm64 -f infrastructure/Dockerfile -t "$RYVIX_IMAGE" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY --build-arg NEXT_PUBLIC_SITE_URL .
          docker push "$RYVIX_IMAGE"
          WORKER_IMAGE="${RYVIX_IMAGE%:*}-workers:${RYVIX_IMAGE##*:}"
          docker build --platform linux/arm64 -f infrastructure/Dockerfile.workers -t "$WORKER_IMAGE" .
          docker push "$WORKER_IMAGE"
          for KIND in node egress; do
            IMAGE="${RYVIX_IMAGE%:*}-workspace-$KIND:${RYVIX_IMAGE##*:}"
            docker build --platform linux/arm64 -f "infrastructure/workspaces/Dockerfile.$KIND" -t "$IMAGE" infrastructure/workspaces
            docker push "$IMAGE"
          done
      - name: Clear registry credentials
        if: always()
        run: docker logout ghcr.io

  deploy:
    needs: publish
    runs-on: [self-hosted, Linux, ryvix-production]
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Authenticate registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - name: Deploy and verify revision, rolling back on failure
        env:
          RYVIX_IMAGE: ${{ needs.publish.outputs.image }}
          RYVIX_RELEASE_SHA: ${{ needs.publish.outputs.revision }}
          RYVIX_RUNTIME_ENV_FILE: ${{ vars.RYVIX_RUNTIME_ENV_FILE }}
          RYVIX_HEALTH_URL: ${{ vars.RYVIX_HEALTH_URL }}
          RYVIX_HTTP_PORT: ${{ vars.RYVIX_HTTP_PORT }}
          RYVIX_DEPLOY_WORKERS: ${{ vars.RYVIX_DEPLOY_WORKERS }}
          RYVIX_WORKER_ENV_DIR: ${{ vars.RYVIX_WORKER_ENV_DIR }}
          RYVIX_DOCKER_GID: ${{ vars.RYVIX_DOCKER_GID }}
        run: node scripts/deploy.mjs
      - name: Clear registry credentials
        if: always()
        run: docker logout ghcr.io
